name: Fork Release

# Publishes a release of this fork by hand: Actions → Fork Release → Run
# workflow, with the tag to publish (for example v0.5.0). The tag must
# already be pushed, on a commit whose Cargo.toml has the same version.
#
# The release is created if it does not exist yet — marked latest, not a
# prerelease — and build.yml then attaches the same assets release.yml does
# (claude-code-sync-windows-x86_64.exe.zip and the rest, each with its
# .sha256), which is what install.sh, install.ps1, self-update and
# cargo-binstall download. release.yml and ci.yml are unchanged.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, for example v0.5.0
        type: string
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Create the release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      # A binary whose --version disagrees with its release is worse than
      # no release at all; checked before any platform builds.
      - name: Check the crate version matches the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          crate_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$crate_version" != "${TAG#v}" ]; then
            echo "Cargo.toml is $crate_version but the tag is $TAG." >&2
            exit 1
          fi

      - name: Create the release if it is missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; attaching the assets to it"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --generate-notes --verify-tag --latest
          fi

  build-binaries:
    name: Build Release Binaries
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ inputs.tag }}
